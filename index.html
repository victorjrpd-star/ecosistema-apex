<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0c0c0c">
  <title>Ecosistema Apex</title>
  
  <!-- CONFIGURACIÓN PWA & ICONOS OFICIALES -->
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ecosistema Apex">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" href="./icon-192.png">

  <!-- CDN Oficial de Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #050507;
      --card-bg: rgba(18, 18, 22, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #e50914;
      --text-main: #ffffff;
      --text-muted: #888888;
      --status-ok: #22c55e;
      --status-warn: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { background: var(--bg); color: var(--text-main); width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.03), inset 0 0 15px rgba(255, 255, 255, 0.02); }
      50% { box-shadow: 0 0 35px rgba(255, 255, 255, 0.08), inset 0 0 25px rgba(255, 255, 255, 0.05); }
      100% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.03), inset 0 0 15px rgba(255, 255, 255, 0.02); }
    }

    /* PORTAL DE ACCESO (LOGIN / REGISTRO) - EFECTO CRISTAL 3D */
    .login-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #111116 0%, #050507 100%);
      z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-y: auto;
    }
    .login-box {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: pulseGlow 4s infinite ease-in-out;
      transform: perspective(1000px);
    }
    .login-title { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; text-align: center; margin-bottom: 6px; letter-spacing: 1px; }
    .login-title span { color: var(--accent); }
    .login-sub { font-size: 0.75rem; color: #888888; text-align: center; margin-bottom: 16px; text-transform: uppercase; font-weight: 700; }

    /* IDENTIFICACIÓN PREVIA DE FOTO Y ROL DINÁMICO */
    .login-identity-preview {
      display: flex; align-items: center; gap: 12px; background: rgba(10, 10, 14, 0.6); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; margin-bottom: 14px; display: none;
    }
    .identity-avatar {
      width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #222;
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 0.8rem; color: #fff; flex-shrink: 0; overflow: hidden;
    }
    .identity-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .identity-text { flex: 1; min-width: 0; }
    .identity-text strong { font-size: 0.85rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .identity-text span { font-size: 0.62rem; color: #888888; display: block; text-transform: uppercase; letter-spacing: 0.5px; }

    /* BANNER DE MENSAJES / ALERTAS SOBRIO */
    .login-message-banner {
      background: rgba(15, 15, 20, 0.8); border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 12px; margin-bottom: 14px; font-size: 0.73rem; color: #ccc; line-height: 1.4;
      display: none;
    }
    .login-message-banner.error { border-color: rgba(229,9,20,0.4); background: rgba(229,9,20,0.08); color: #fca5a5; }
    .login-message-banner.success { border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.08); color: #86efac; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; color: #888888; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 10px 12px; background: rgba(10, 10, 14, 0.7); border: 1px solid var(--border); color: #fff; border-radius: 6px; font-weight: 700; outline: none; font-size: 0.85rem; color-scheme: dark; }
    .form-control:focus { border-color: var(--accent); }
    
    /* BOTÓN ESTILO APEX */
    .btn {
      background: #141418;
      color: #fff;
      border: 1px solid rgba(229, 9, 20, 0.4);
      padding: 12px;
      width: 100%;
      font-weight: 900;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(229, 9, 20, 0.1);
    }
    .btn:hover { background: #1a1a20; border-color: var(--accent); }
    .btn:active { filter: brightness(0.85); transform: scale(0.99); }
    .btn:disabled { background: #111; color: #555; border-color: #222; box-shadow: none; cursor: not-allowed; }
    .btn-secondary { background: rgba(20,20,24,0.5); border: 1px solid var(--border); color: #aaa; margin-top: 8px; box-shadow: none; }

    .form-switch-text { text-align: center; font-size: 0.75rem; color: #888888; margin-top: 14px; font-weight: 700; cursor: pointer; }
    .form-switch-text span { color: var(--accent); text-decoration: underline; }

    /* APLICACIÓN PRINCIPAL */
    .app-container { display: none; width: 100%; height: 100%; flex-direction: column; }
    .app-container.active { display: flex; }

    /* MARCO GENERAL: BARRA SUPERIOR */
    .apex-global-header {
      height: 62px; background: #141414; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; padding: 0 14px; flex-shrink: 0; z-index: 100;
    }
    
    .brand-wrapper { display: flex; flex-direction: column; justify-content: center; gap: 3px; }
    .apex-brand { font-size: 0.85rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.8px; color: #fff; line-height: 1; }
    .apex-brand-sub { font-size: 0.55rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); line-height: 1; }

    .connection-status-pill {
      background: transparent; padding: 0;
      border-radius: 0; font-size: 0.52rem; font-weight: 800; text-transform: uppercase;
      display: flex; align-items: center; gap: 4px; color: #888888;
      letter-spacing: 0.5px; line-height: 1; margin-top: 2px;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--status-ok); }
    .status-dot.offline { background: var(--accent); }

    .apex-nav-container { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center; flex: 1; margin: 0 10px; }
    .apex-nav-container::-webkit-scrollbar { display: none; }

    .nav-tab-btn {
      background: #1a1a1a; border: 1px solid var(--border); color: #888888;
      padding: 6px 10px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
      cursor: pointer; white-space: nowrap; transition: 0.2s;
    }
    .nav-tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .global-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      background: transparent; border: none; color: #fff; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.15rem;
      transition: opacity 0.2s; padding: 0;
    }
    .icon-btn:active { opacity: 0.6; }
    .icon-svg { width: 22px; height: 22px; fill: currentColor; display: block; }

    .apex-viewport-container { flex: 1; width: 100%; position: relative; background: var(--bg); overflow: hidden; }
    .block-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; background: var(--bg); }
    .block-frame.active { display: block; }

    /* MODAL DE AJUSTES */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #141414; border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 380px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 1rem; font-weight: 900; text-transform: uppercase; margin-bottom: 14px; text-align: center; color: #fff; }
    
    .profile-preview-wrapper { position: relative; width: 80px; height: 80px; margin: 0 auto 10px auto; cursor: pointer; }
    .profile-preview { width: 100%; height: 100%; border-radius: 50%; background: #222; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .profile-preview img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-camera-pill { position: absolute; bottom: -2px; right: -2px; background: var(--accent); color: #fff; border-radius: 50%; width: 24px; height: 24px; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; border: 2px solid #000; }
    .upload-hint { text-align: center; font-size: 0.65rem; color: #888888; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
    .modal-divider { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
  </style>
</head>
<body>

  <!-- PORTAL DE ACCESO -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      
      <!-- INICIO DE SESIÓN -->
      <div id="loginFormSection">
        <div class="login-title">Apex Boxing <span>Core</span></div>
        <div class="login-sub">Iniciar Sesión</div>

        <!-- BANNER DE MENSAJES UX SOBRIO -->
        <div id="loginMessageBanner" class="login-message-banner"></div>

        <!-- IDENTIFICACIÓN PREVIA DE FOTO Y ROL DINÁMICO -->
        <div id="loginIdentityPreview" class="login-identity-preview">
          <div class="identity-avatar" id="identityAvatarBox">ST</div>
          <div class="identity-text">
            <strong id="identityNameTxt">Identificando...</strong>
            <span id="identityRoleSub">Striker Identificado</span>
          </div>
        </div>
        
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="usuario@apex.com" onblur="identificarUsuarioPorCorreo(this.value)">
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
        </div>

        <button class="btn" onclick="realizarLogin()">Entrar</button>
        <div class="form-switch-text" onclick="toggleFormMode('register')">¿No tienes cuenta? <span>Regístrate aquí</span></div>
      </div>

      <!-- REGISTRO PÚBLICO -->
      <div id="registerFormSection" style="display: none;">
        <div class="login-title">Apex Boxing <span>Core</span></div>
        <div class="login-sub">Crear Nueva Cuenta</div>

        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" id="regName" class="form-control" placeholder="Ej: Juan Pérez">
        </div>

        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="regEmail" class="form-control" placeholder="usuario@apex.com">
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••">
        </div>

        <button class="btn" onclick="realizarRegistro()">Registrarse</button>
        <button class="btn btn-secondary" onclick="toggleFormMode('login')">Volver al Login</button>
      </div>

    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL (APP SHELL) -->
  <div class="app-container" id="appContainer">
    <header class="apex-global-header">
      <div class="brand-wrapper">
        <div class="apex-brand">Apex Boxing</div>
        <div class="apex-brand-sub">Core</div>
        <!-- INDICADOR DE ESTADO DE RED SEPARADO -->
        <div class="connection-status-pill" id="netStatusPill">
          <div class="status-dot" id="netStatusDot"></div>
          <span id="netStatusText">En Línea</span>
        </div>
      </div>
      
      <!-- NAVEGACIÓN DE MÓDULOS -->
      <nav class="apex-nav-container" id="apexNavBar"></nav>
      
      <!-- ACCIONES GLOBALES SUPERIORES -->
      <div class="global-actions">
        <button class="icon-btn" onclick="openConfigModal()" title="Configuración de Cuenta">⚙</button>
        <button class="icon-btn" onclick="forzarActualizacionTotal()" title="Actualizar Aplicación">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        </button>
      </div>
    </header>

    <div class="apex-viewport-container" id="apexViewportContainer"></div>
  </div>

  <!-- MODAL DE CONFIGURACIÓN -->
  <div class="modal-overlay" id="configModal">
    <div class="modal-box">
      <div class="modal-title">Ajustes de Cuenta</div>
      
      <!-- INPUT NATIVO PARA CÁMARA Y ARCHIVOS -->
      <input type="file" id="inputFotoDispositivo" accept="image/*" style="display: none;" onchange="subirFotoDesdeDispositivo(this.files)">

      <!-- PREVIEW CON DISPARADOR TÁCTICO -->
      <div class="profile-preview-wrapper" onclick="document.getElementById('inputFotoDispositivo').click()" title="Toca para tomar foto o elegir archivo">
        <div class="profile-preview" id="profilePicContainer">
          <span style="font-size: 1.5rem; color: #555;">👤</span>
        </div>
        <div class="avatar-camera-pill">📷</div>
      </div>
      <div class="upload-hint" id="txtUploadState">Toca la foto para cambiarla</div>

      <div class="form-group">
        <label>Nombre Completo</label>
        <input type="text" id="cfgName" class="form-control">
      </div>

      <button class="btn" id="btnGuardarAjustes" onclick="guardarAjustes()">Guardar Cambios</button>

      <hr class="modal-divider">

      <div class="modal-title" style="font-size: 0.9rem; margin-bottom: 10px;">Seguridad</div>
      <div class="form-group">
        <label>Nueva Contraseña</label>
        <input type="password" id="cfgNewPassword" class="form-control" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="form-group">
        <label>Confirmar Nueva Contraseña</label>
        <input type="password" id="cfgConfirmPassword" class="form-control" placeholder="Repite la contraseña">
      </div>
      <button class="btn btn-secondary" onclick="actualizarContrasenaCuenta()">Actualizar Contraseña</button>

      <!-- BOTÓN DE INSTALACIÓN DENTRO DE CONFIGURACIÓN -->
      <div id="installPwaWrapper" style="display: none; margin-top: 14px;">
        <button class="btn" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff;" onclick="dispararInstalacionPWA()">✨ Instalar Aplicación</button>
      </div>

      <!-- BOTÓN DE CERRAR SESIÓN -->
      <button class="btn btn-secondary" style="margin-top: 14px; background: rgba(229,9,20,0.1); border-color: rgba(229,9,20,0.3); color: var(--accent);" onclick="cerrarSesion()">Cerrar Sesión</button>

      <button class="btn btn-secondary" style="margin-top: 8px;" onclick="closeConfigModal()">Cerrar</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fprvbvucmtdpxdihuvrw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_xAMs8LpCwyMyoql3ohoJUQ_BIRhBQoD';
    const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let currentSessionUser = null;
    let deferredPrompt = null;

    /* ==========================================================================
        GESTOR DE RED Y NOTIFICACIÓN PROFESIONAL OFFLINE
        ========================================================================== */
    window.addEventListener('online', () => {
      actualizarEstadoRed(true);
    });

    window.addEventListener('offline', () => {
      actualizarEstadoRed(false);
    });

    function actualizarEstadoRed(isOnline) {
      const dot = document.getElementById('netStatusDot');
      const text = document.getElementById('netStatusText');
      if (!dot || !text) return;

      dot.className = 'status-dot';
      if (isOnline) {
        text.innerText = 'En Línea';
      } else {
        dot.classList.add('offline');
        text.innerText = 'Modo Offline';
      }
    }

    function mostrarMensajeLogin(texto, tipo = 'error') {
      const banner = document.getElementById('loginMessageBanner');
      if (!banner) return;
      banner.innerText = texto;
      banner.className = `login-message-banner ${tipo}`;
      banner.style.display = 'block';
    }

    function ocultarMensajeLogin() {
      const banner = document.getElementById('loginMessageBanner');
      if (banner) banner.style.display = 'none';
    }

    async function identificarUsuarioPorCorreo(correo) {
      const email = (correo || '').trim().toLowerCase();
      const previewBox = document.getElementById('loginIdentityPreview');
      const avatarBox = document.getElementById('identityAvatarBox');
      const nameTxt = document.getElementById('identityNameTxt');
      const roleSub = document.getElementById('identityRoleSub');

      if (!email || !email.includes('@') || !sb) {
        if (previewBox) previewBox.style.display = 'none';
        return;
      }

      try {
        const { data, error } = await sb.from('apex_users').select('name, email, photo_url, avatar_url, role, profile_id').eq('email', email).maybeSingle();
        
        if (error || !data) {
          if (previewBox) previewBox.style.display = 'none';
          return;
        }

        if (nameTxt) nameTxt.innerText = data.name || 'Usuario Apex';

        const rawRole = data.role || data.profile_id || 'estudiante';
        const formattedRole = rawRole.charAt(0).toUpperCase() + rawRole.slice(1).toLowerCase();
        if (roleSub) {
          roleSub.innerText = `${formattedRole} Apex Identificado`;
        }

        const foto = data.photo_url || data.avatar_url;
        if (avatarBox) {
          if (foto && foto.startsWith('http')) {
            avatarBox.innerHTML = `<img src="${foto}" alt="Avatar">`;
          } else {
            avatarBox.innerHTML = (data.name || 'ST').substring(0, 2).toUpperCase();
          }
        }

        if (previewBox) previewBox.style.display = 'flex';
      } catch (e) {
        if (previewBox) previewBox.style.display = 'none';
      }
    }

    window.addEventListener('fetch', (event) => {
      if (!navigator.onLine) {
        alert("⚠️ Estás sin conexión. Conéctate a internet para ejecutar esta acción en el Ecosistema Apex.");
      }
    });

    /* ==========================================================================
        FUNCIÓN MEJORADA: PURGA DE CACHÉ Y RECARGA FORZADA (ÁMBITO LOCAL)
        ========================================================================== */
    async function forzarActualizacionTotal() {
      if (!navigator.onLine) {
        alert("⚠️ Estás offline. Conéctate a internet para actualizar la aplicación.");
        return;
      }
      
      if (confirm("¿Deseas purgar la memoria local y actualizar todas las herramientas del ecosistema?")) {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const registration of registrations) {
              await registration.unregister();
            }
          }

          if ('caches' in window) {
            const cacheNames = await caches.keys();
            for (const name of cacheNames) {
              await caches.delete(name);
            }
          }

          const timestamp = new Date().getTime();
          window.location.href = window.location.pathname + '?v=' + timestamp;
          
        } catch (error) {
          console.error("Error al purgar la caché de Apex:", error);
          window.location.reload(true);
        }
      }
    }

    /* REGISTRO DE SERVICE WORKER Y GESTIÓN PWA */
    window.addEventListener('load', () => {
      actualizarEstadoRed(navigator.onLine);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker registrado con éxito.'))
          .catch(err => console.log('Error al registrar Service Worker:', err));
      }
    });

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!window.matchMedia('(display-mode: standalone)').matches) {
        const wrapper = document.getElementById('installPwaWrapper');
        if (wrapper) wrapper.style.display = 'block';
      }
    });

    window.addEventListener('appinstalled', () => {
      const wrapper = document.getElementById('installPwaWrapper');
      if (wrapper) wrapper.style.display = 'none';
      deferredPrompt = null;
    });

    async function dispararInstalacionPWA() {
      if (!deferredPrompt) {
        alert('Para instalar la aplicación, usa las opciones de tu navegador o ya se encuentra instalada.');
        return;
      }
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        const wrapper = document.getElementById('installPwaWrapper');
        if (wrapper) wrapper.style.display = 'none';
      }
      deferredPrompt = null;
    }

    async function initPortal() {
      if (!window.matchMedia('(display-mode: standalone)').matches && window.navigator.standalone !== true) {
        const wrapper = document.getElementById('installPwaWrapper');
        if (wrapper) wrapper.style.display = 'block';
      }

      try {
        if (navigator.onLine && sb) {
          const { data: { session } } = await sb.auth.getSession();
          if (session) {
            await cargarDatosUsuario(session.user.id);
            return;
          }
        }
      } catch (e) {
        console.log("Modo sin conexión o error de red al obtener sesión");
      }

      const cachedUserJson = localStorage.getItem('apex_session_user');
      if (cachedUserJson) {
        try {
          const cachedUser = JSON.parse(cachedUserJson);
          await validarYCargarSesionOffline(cachedUser);
        } catch (err) {
          console.warn("Error al parsear sesión en caché");
        }
      }
    }

    async function validarYCargarSesionOffline(profileData) {
      const rolActual = (profileData.role || '').toLowerCase();
      const perfilActual = (profileData.profile_id || '').toLowerCase();
      const esStaff = ['admin', 'administrador', 'coach', 'supervisor', 'coordinador'].includes(rolActual) || 
                      ['admin', 'administrador', 'coach', 'supervisor', 'coordinador'].includes(perfilActual);

      if (!esStaff) {
        const hoy = new Date(); hoy.setHours(0,0,0,0);
        const fechaExpStr = profileData.subscription_expires_at || profileData.membership_end;
        let vencido = false;

        if (fechaExpStr) {
          const expDate = new Date(fechaExpStr.includes('T') ? fechaExpStr : fechaExpStr + 'T00:00:00');
          if (expDate < hoy) vencido = true;
        }

        if (profileData.subscription_status === 'vencido' || profileData.is_active === false || vencido) {
          return;
        }
      }

      currentSessionUser = profileData;
      
      let userModules = JSON.parse(localStorage.getItem('apex_user_modules') || '[]');
      if (userModules.length === 0) {
        userModules = [{ id: 'b_usuario', title: 'Ficha Estudiante', url: 'usuario.html' }];
      }

      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appContainer').classList.add('active');
      renderAppModules(userModules);
    }

    function toggleFormMode(mode) {
      ocultarMensajeLogin();
      document.getElementById('loginFormSection').style.display = mode === 'register' ? 'none' : 'block';
      document.getElementById('registerFormSection').style.display = mode === 'register' ? 'block' : 'none';
    }

    async function realizarRegistro() {
      if (!navigator.onLine) {
        mostrarMensajeLogin('⚠️ Estás offline. Conéctate a internet para registrar una nueva cuenta.', 'error');
        return;
      }

      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      if (!name || !email || !password) {
        mostrarMensajeLogin('Por favor completa todos los campos del formulario.', 'error');
        return;
      }

      if (password.length < 6) {
        mostrarMensajeLogin('La contraseña debe tener mínimo 6 caracteres.', 'error');
        return;
      }

      const { data, error } = await sb.auth.signUp({ 
        email, 
        password,
        options: { data: { name: name, role: 'estudiante', profile_id: 'estudiante' } }
      });

      if (error) {
        mostrarMensajeLogin('Error en registro: ' + error.message, 'error');
        return;
      }

      if (data.user) {
        await sb.from('apex_users').upsert([
          { 
            id: data.user.id, email, name, role: 'estudiante', profile_id: 'estudiante', 
            photo_url: null, avatar_url: null, is_active: true, 
            subscription_status: 'activo', last_active_at: new Date().toISOString()
          }
        ]);
        alert('¡Usuario registrado con éxito! Ya puedes iniciar sesión.');
        toggleFormMode('login');
        document.getElementById('loginEmail').value = email;
      }
    }

    async function realizarLogin() {
      ocultarMensajeLogin();
      if (!navigator.onLine) {
        mostrarMensajeLogin('⚠️ Estás offline. El inicio de sesión requiere conexión a internet.', 'error');
        return;
      }

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!email || !password) {
        mostrarMensajeLogin('Por favor ingresa tu correo electrónico y tu contraseña.', 'error');
        return;
      }

      const { data: userCheck } = await sb.from('apex_users').select('*').eq('email', email.toLowerCase()).maybeSingle();
      if (!userCheck) {
        mostrarMensajeLogin('El correo ingresado no se encuentra registrado en el ecosistema. Verifica tus datos o contacta a administración.', 'error');
        return;
      }

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        mostrarMensajeLogin('La contraseña es incorrecta. Por favor, vuelve a intentarlo.', 'error');
        return;
      }

      const rolActual = (userCheck.role || '').toLowerCase();
      const perfilActual = (userCheck.profile_id || '').toLowerCase();
      const esStaff = ['admin', 'administrador', 'coach', 'supervisor', 'coordinador'].includes(rolActual) || 
                      ['admin', 'administrador', 'coach', 'supervisor', 'coordinador'].includes(perfilActual);

      if (!esStaff) {
        const hoy = new Date(); hoy.setHours(0,0,0,0);
        const fechaExpStr = userCheck.subscription_expires_at || userCheck.membership_end;
        let vencido = false;

        if (fechaExpStr) {
          const expDate = new Date(fechaExpStr.includes('T') ? fechaExpStr : fechaExpStr + 'T00:00:00');
          if (expDate < hoy) vencido = true;
        }

        if (userCheck.subscription_status === 'vencido' || userCheck.is_active === false || vencido) {
          mostrarMensajeLogin('Tu membresía se encuentra inactiva o ha expirado. Consulta con tu coach o administración para gestionar tu renovación y reactivar el acceso.', 'error');
          await sb.auth.signOut();
          return;
        }
      }

      mostrarMensajeLogin('¡Acceso autorizado! Cargando entorno Apex...', 'success');
      await sb.from('apex_users').update({ last_active_at: new Date().toISOString() }).eq('id', data.user.id);
      setTimeout(() => { cargarDatosUsuario(data.user.id); }, 600);
    }

    async function cargarDatosUsuario(userId) {
      if (!navigator.onLine) {
        alert('⚠️ Estás offline. No es posible sincronizar datos remotos del usuario.');
        return;
      }

      let profileData = null;
      try {
        const res = await sb.from('apex_users').select('*').eq('id', userId).single();
        profileData = res.data;
      } catch (e) {
        console.warn("No se pudo cargar perfil online");
      }

      if (!profileData) {
        const cached = localStorage.getItem('apex_session_user');
        if (cached) profileData = JSON.parse(cached);
      }

      if (!profileData) {
        profileData = { id: userId, email: '', name: 'Usuario Apex', profile_id: 'estudiante', role: 'estudiante', photo_url: null, avatar_url: null, subscription_status: 'activo' };
      }

      currentSessionUser = profileData;

      localStorage.setItem('apex_session_user', JSON.stringify(profileData));
      localStorage.setItem('apex_user_email', profileData.email || '');
      localStorage.setItem('apex_user_profile', profileData.profile_id || 'estudiante');
      if (profileData.photo_url || profileData.avatar_url) {
        localStorage.setItem('apex_user_avatar', profileData.photo_url || profileData.avatar_url);
      }

      let userModules = [];
      try {
        const { data: rels } = await sb
          .from('apex_profile_blocks')
          .select('block_id, display_order')
          .eq('profile_id', currentSessionUser.profile_id)
          .order('display_order', { ascending: true });

        if (rels && rels.length > 0) {
          const blockIds = rels.map(r => r.block_id);
          const { data: blocks } = await sb.from('apex_blocks').select('*').in('id', blockIds);
          userModules = rels.map(r => blocks.find(b => b.id === r.block_id)).filter(Boolean);
        }
      } catch (err) {
        console.warn("Usando módulos cacheados localmente");
      }

      if (userModules.length === 0) {
        userModules = JSON.parse(localStorage.getItem('apex_user_modules') || '[]');
      }
      if (userModules.length === 0) {
        userModules = [{ id: 'b_usuario', title: 'Ficha Estudiante', url: 'usuario.html' }];
      }

      localStorage.setItem('apex_user_modules', JSON.stringify(userModules));

      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appContainer').classList.add('active');

      renderAppModules(userModules);
    }

    function renderAppModules(modules) {
      const navBar = document.getElementById('apexNavBar');
      const container = document.getElementById('apexViewportContainer');

      navBar.innerHTML = '';
      container.innerHTML = '';

      modules.forEach((mod, index) => {
        const tabBtn = document.createElement('button');
        tabBtn.className = `nav-tab-btn ${index === 0 ? 'active' : ''}`;
        tabBtn.textContent = mod.title;
        tabBtn.onclick = () => switchBlock(mod.id, tabBtn);
        navBar.appendChild(tabBtn);

        const iframe = document.createElement('iframe');
        iframe.className = `block-frame ${index === 0 ? 'active' : ''}`;
        iframe.id = `block_${mod.id}`;
        iframe.src = mod.url;
        container.appendChild(iframe);
      });
    }

    function switchBlock(id, btnElement) {
      document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.block-frame').forEach(f => f.classList.remove('active'));

      btnElement.classList.add('active');
      const targetFrame = document.getElementById(`block_${id}`);
      if (targetFrame) targetFrame.classList.add('active');
    }

    async function cerrarSesion() {
      if (confirm("¿Estás seguro de que deseas cerrar sesión?")) {
        if (navigator.onLine && sb) await sb.auth.signOut();
        currentSessionUser = null;
        localStorage.clear();
        window.location.reload();
      }
    }

    function openConfigModal() {
      if (!currentSessionUser) return;
      document.getElementById('cfgName').value = currentSessionUser.name || '';
      document.getElementById('cfgNewPassword').value = '';
      document.getElementById('cfgConfirmPassword').value = '';
      actualizarPreviewFoto(currentSessionUser.photo_url || currentSessionUser.avatar_url);
      document.getElementById('configModal').classList.add('open');
    }

    function closeConfigModal() {
      document.getElementById('configModal').classList.remove('open');
    }

    function actualizarPreviewFoto(url) {
      const container = document.getElementById('profilePicContainer');
      if (url) {
        container.innerHTML = `<img src="${url}" alt="Perfil">`;
      } else {
        container.innerHTML = `<span style="font-size: 1.5rem; color: #555;">👤</span>`;
      }
    }

    async function subirFotoDesdeDispositivo(files) {
      if (!navigator.onLine) {
        alert("⚠️ Estás offline. No puedes subir archivos ni actualizar la foto de perfil sin conexión.");
        return;
      }
      if (!files || files.length === 0 || !currentSessionUser) return;
      
      const file = files[0];
      const hint = document.getElementById('txtUploadState');
      const btnGuardar = document.getElementById('btnGuardarAjustes');
      
      hint.innerText = 'Subiendo imagen a Apex...';
      hint.style.color = 'var(--status-ok)';
      btnGuardar.disabled = true;

      try {
        const ext = file.name.split('.').pop() || 'jpg';
        const cleanEmail = (currentSessionUser.email || currentSessionUser.id).replace(/[^a-zA-Z0-9]/g, '_');
        const filePath = `avatars/${Date.now()}_${cleanEmail}.${ext}`;

        const { error: uploadErr } = await sb.storage.from('avatars').upload(filePath, file, { upsert: true });
        if (uploadErr) throw uploadErr;
        const { data: urlData } = sb.storage.from('avatars').getPublicUrl(filePath);
        const publicUrl = urlData.publicUrl;

        await sb.from('apex_users').update({ 
          photo_url: publicUrl, 
          avatar_url: publicUrl, 
          last_active_at: new Date().toISOString() 
        }).eq('id', currentSessionUser.id);

        currentSessionUser.photo_url = publicUrl;
        currentSessionUser.avatar_url = publicUrl;
        localStorage.setItem('apex_user_avatar', publicUrl);
        localStorage.setItem('apex_session_user', JSON.stringify(currentSessionUser));
        actualizarPreviewFoto(publicUrl);

        hint.innerText = '¡Foto actualizada con éxito!';
        hint.style.color = 'var(--status-ok)';
      } catch (err) {
        alert('Error al subir la imagen: ' + err.message);
        hint.innerText = 'Error al subir imagen';
        hint.style.color = 'var(--accent)';
      }

      btnGuardar.disabled = false;
    }

    async function guardarAjustes() {
      if (!navigator.onLine) {
        alert("⚠ Estás offline. Conéctate a internet para guardar los ajustes en el servidor.");
        return;
      }

      const newName = document.getElementById('cfgName').value.trim();

      const { error } = await sb
        .from('apex_users')
        .update({ name: newName, last_active_at: new Date().toISOString() })
        .eq('id', currentSessionUser.id);

      if (error) {
        alert('Error al guardar ajustes: ' + error.message);
        return;
      }

      currentSessionUser.name = newName;
      localStorage.setItem('apex_session_user', JSON.stringify(currentSessionUser));
      alert('¡Ajustes guardados con éxito!');
      closeConfigModal();
    }

    async function actualizarContrasenaCuenta() {
      if (!navigator.onLine) {
        alert('⚠️ Estás offline. No es posible actualizar la contraseña sin conexión a internet.');
        return;
      }

      const p1 = document.getElementById('cfgNewPassword').value.trim();
      const p2 = document.getElementById('cfgConfirmPassword').value.trim();

      if (!p1 || p1.length < 6) {
        alert('La nueva contraseña debe tener al menos 6 caracteres.');
        return;
      }
      if (p1 !== p2) {
        alert('Las contraseñas no coinciden.');
        return;
      }

      const { error } = await sb.auth.updateUser({ password: p1 });

      if (error) {
        alert('Error al actualizar la contraseña: ' + error.message);
      } else {
        alert('¡Contraseña actualizada con éxito!');
        document.getElementById('cfgNewPassword').value = '';
        document.getElementById('cfgConfirmPassword').value = '';
        closeConfigModal();
      }
    }

    window.onload = initPortal;
  </script>
